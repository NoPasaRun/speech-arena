name: Deploy web build to GitHub Pages

on:
  push:
    branches: [master]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Assemble site
        run: |
          mkdir _site
          cp -r web/. _site/
          rm -f _site/*.import _site/empty
          mv "_site/Veselyi Trambon Arena.html" _site/index.html
          touch _site/.nojekyll
          # Докачка .pck/.wasm после обрыва сети вместо загрузки с нуля.
          python3 .github/scripts/patch_preloader.py "_site/Veselyi Trambon Arena.js"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
